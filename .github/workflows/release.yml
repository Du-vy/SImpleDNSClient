name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            divert_folder: x64
            divert_files: "WinDivert.dll WinDivert64.sys"
          - goarch: "386"
            divert_folder: x86
            divert_files: "WinDivert.dll WinDivert32.sys WinDivert64.sys"
          - goarch: arm64
            divert_folder: ""
            divert_files: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Determine Version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v1.0.0"
          fi
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          GIT_COMMIT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "git_commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT

      - name: Download WinDivert Binaries
        run: |
          curl -sL https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -o windivert.zip
          unzip -q windivert.zip

      - name: Build SimpleDNS Binary (windows/${{ matrix.goarch }})
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X main.Version=${{ steps.vars.outputs.version }} -X main.BuildDate=${{ steps.vars.outputs.build_date }} -X main.GitCommit=${{ steps.vars.outputs.git_commit }}"
          mkdir -p dist
          go build -trimpath -ldflags="${LDFLAGS}" -o dist/simpledns.exe ./cmd/simpledns

      - name: Package Release Archive
        run: |
          PKG_NAME="SimpleDNS-${{ steps.vars.outputs.version }}-windows-${{ matrix.goarch }}"
          mkdir -p "package/${PKG_NAME}"
          cp dist/simpledns.exe "package/${PKG_NAME}/"
          cp configs/simpledns.example.yaml "package/${PKG_NAME}/simpledns.yaml"
          cp configs/simpledns.example.yaml "package/${PKG_NAME}/simpledns.example.yaml"
          cp README.md "package/${PKG_NAME}/"
          cp LICENSE "package/${PKG_NAME}/"
          cp -r docs "package/${PKG_NAME}/"

          if [ -n "${{ matrix.divert_folder }}" ]; then
            for f in ${{ matrix.divert_files }}; do
              cp "WinDivert-2.2.2-A/${{ matrix.divert_folder }}/${f}" "package/${PKG_NAME}/"
            done
          fi

          cd package
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}
          path: |
            package/*.zip
            package/*.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate Checksums Manifest
        run: |
          cd release-assets
          cat *.zip.sha256 > SHA256SUMS.txt
          rm -f *.zip.sha256
          ls -la

      - name: Determine Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: SimpleDNS ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
